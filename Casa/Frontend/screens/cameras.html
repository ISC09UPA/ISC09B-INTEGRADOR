<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e11">
<title>CasaLink · Cámaras</title>
<link rel="stylesheet" href="/screens/styles.css">
</head>
<body>
<main class="screen wrap">
    <div class="top">
    <h1>Cámaras</h1>
    <span class="ok" style="font-size:.8rem">● <span id="enLinea">0</span> en línea</span>
    </div>

    <div class="card ban" id="ban" hidden>
    <div class="ic">
        <svg class="i">
        <use href="#bell"/>
        </svg>
    </div>
    <div>
        <b>Movimiento detectado</b>
        <p class="mute" id="banD"></p>
    </div>
    </div>

    <div class="acts" id="banAct" hidden>
    <button class="btn red" id="verCam">Ver cámara</button>
    <button class="btn out" id="descartar">Descartar</button>
    </div>

    <div class="live" id="live">
    <span class="pill l"><span style="color:var(--red)">●</span> EN VIVO</span>
    <span class="pill r" id="reloj"></span>
    <img id="cam" alt="Cámara en vivo" hidden>
    <div class="nocam" id="nocam">Esta cámara aún no está conectada.</div>
    <span class="pill rc" id="reco" hidden>Rostro reconocido</span>
    <span class="pill z" id="zona">Entrada</span>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="card row">
    <div>
        <b>Sensor de movimiento</b>
        <p class="mute">Vigila el interior con la casa asegurada</p>
    </div>
    <label class="switch">
        <input type="checkbox" id="segSw" aria-label="Sensor de movimiento">
        <i></i>
    </label>
    </div>

    <h2>Alertas recientes</h2>
    <div id="eventos"></div>
</main>

<nav>
    <div class="wrap">
    <button data-nav="/screens/home.html">
        <svg class="i">
        <use href="#home"/>
        </svg>
        Inicio
    </button>
    <button class="on" data-nav="/screens/cameras.html">
        <svg class="i">
        <use href="#video"/>
        </svg>
        Cámaras
    </button>
    <button id="nSalir">
