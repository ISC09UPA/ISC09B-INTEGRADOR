<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0e11">
  <title>CasaLink · Inicio</title>
  <link rel="stylesheet" href="/screens/styles.css">
</head>
<body>
  <main class="screen wrap">
    <div class="top">
      <div>
        <p class="mute" id="saludo"></p>
        <h1>Mi casa</h1>
      </div>
      <div class="avatar">
        <svg class="i">
          <use href="#user"/>
        </svg>
      </div>
    </div>

    <div class="card seg" id="segCard">
      <div class="ic">
        <svg class="i">
          <use href="#shield"/>
        </svg>
      </div>
      <div>
        <b id="segT">Casa asegurada</b>
        <p class="mute" id="segD">Movimiento interior vigilado</p>
      </div>
      <button class="btn sm" id="segBtn">Desactivar</button>
    </div>

    <div class="two">
      <div class="card">
        <p class="mute row" style="justify-content:flex-start;gap:6px">
          <svg class="i" style="width:16px;height:16px">
            <use href="#sun"/>
          </svg>
          Luz ambiente
        </p>
        <p class="big"><span id="lux">0</span> <small class="mute">lx</small></p>
        <div class="bar">
          <i id="luxBar" style="width:0"></i>
        </div>
        <p class="mute">Ajuste automático activo</p>
      </div>

      <div class="card">
        <p class="mute row" style="justify-content:flex-start;gap:6px">
          <svg class="i" style="width:16px;height:16px">
            <use href="#lock"/>
          </svg>
          Puerta principal
        </p>
        <p class="big ok" id="puerta" style="font-size:1.3rem">Cerrada</p>
        <button class="btn out sm" id="abrir" style="width:100%">Abrir puerta</button>
      </div>
    </div>

    <h2>Iluminación <small id="cuenta"></small></h2>
    <div id="luces"></div>

    <h2>Accesos</h2>
    <div class="card" id="personas"></div>

    <div class="add">
      <input class="inp" id="nueva" type="text" placeholder="Nombre de la persona">
      <button class="btn sm" id="addP">Agregar</button>
    </div>
  </main>

  <nav>
    <div class="wrap">
      <button class="on" data-nav="/screens/home.html">
        <svg class="i">
          <use href="#home"/>
        </svg>
        Inicio
      </button>
      <button data-nav="/screens/cameras.html">
        <svg class="i">
          <use href="#video"/>
        </svg>
        Cámaras
      </button>
      <button id="nSalir">
        <svg class="i">
          <use href="#exit"/>
        </svg>
        Salir
      </button>
    </div>
  </nav>

  <script src="/screens/shared.js"></script>
  <script src="/screens/home.js"></script>
  <script>initHome();</script>
</body>
</html>
