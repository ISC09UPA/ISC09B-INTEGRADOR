<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0e11">
  <title>CasaLink · Iniciar sesión</title>
  <link rel="stylesheet" href="/screens/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js" defer></script>
</head>
<body>
  <section id="login" class="wrap">
    <div class="logo">
      <span>
        <svg class="i">
          <use href="#home"/>
        </svg>
      </span>
      Casa Domótica
    </div>
    
    <h1>Bienvenido a casa</h1>
    <p class="mute">Entra con tu rostro o con tu cuenta.</p>
    
    <div class="face">
      <svg id="faceSvg" viewBox="0 0 150 150" fill="none" stroke="#34d399" stroke-width="3">
        <path d="M10 40V18a8 8 0 0 1 8-8h22M110 10h22a8 8 0 0 1 8 8v22M140 110v22a8 8 0 0 1-8 8h-22M40 140H18a8 8 0 0 1-8-8v-22"/>
        <ellipse cx="75" cy="75" rx="24" ry="30" stroke="#e8f0ee"/>
        <path d="M66 68v4M84 68v4M66 88c5 5 13 5 18 0" stroke="#e8f0ee"/>
      </svg>
      <video id="video" autoplay playsinline muted hidden></video>
    </div>
    
    <p class="stat" id="stat">Pulsa el botón para activar la cámara</p>
    
    <button class="btn" id="rostro">
      <svg class="i">
        <use href="#scan"/>
      </svg>
      <span id="rostroTxt">Entrar con mi rostro</span>
    </button>
    
    <div class="sep">o con tu cuenta</div>
    
    <label class="f" for="email">Correo</label>
    <input class="inp" id="email" type="text" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="correo@ejemplo.com">
    
    <label class="f" for="pass">Contraseña</label>
    <input class="inp" id="pass" type="password" autocomplete="current-password" placeholder="Tu contraseña">
    
    <p class="err" id="err"></p>
    <button class="btn out" id="entrar">Iniciar sesión</button>
  </section>
  
  <script src="/screens/shared.js"></script>
  <script src="/screens/login.js"></script>
</body>
</html>
