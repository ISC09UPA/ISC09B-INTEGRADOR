# Broker MQTT del Alimentador Inteligente (Mosquitto 2.x).
# Se instala como /etc/mosquitto/conf.d/alimentador.conf; el mosquitto.conf de Debian
# ya activa la persistencia en /var/lib/mosquitto (retained y sesiones QoS 1).

per_listener_settings false

# Sin acceso anónimo: el gateway y cada ESP32 tienen usuario y contraseña
allow_anonymous false
password_file /etc/mosquitto/alimentador.passwd

# Cada ESP32 solo puede usar feeder/<su usuario>/# (usuario = Codigo del alimentador)
acl_file /etc/mosquitto/alimentador.acl

# LAN de la casa. Si la Pi tiene varias interfaces, cambia 0.0.0.0 por la IP de la LAN.
listener 1883 0.0.0.0

# Mensajes QoS 1 guardados por cliente desconectado (sesión persistente)
max_queued_messages 1000
# Paquete más grande esperado: config con 3 mascotas y horarios; las fotos van por HTTP
max_packet_size 65536
