[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alimentador-gateway"
version = "1.0.0"
description = "Gateway Raspberry Pi del Alimentador Inteligente: MQTT en la LAN, cola offline y backend"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.3,<3",
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
alimentador-gateway = "alimentador_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["alimentador_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
