; Firmware del Alimentador Inteligente (ESP32-S3 con cámara y PSRAM).
;
; Entornos:
;   esp32s3cam  Placa genérica ESP32-S3-WROOM-1 N8R8 con OV2640 (Freenove ESP32-S3 CAM,
;               pines de cámara iguales a la ESP32-S3-EYE). Es el entorno por defecto.
;   xiao_s3     Seeed Studio XIAO ESP32S3 Sense.
;   native      Pruebas de la lógica pura en la computadora (pio test -e native).
;
; Flash de 8 MB: dos particiones de aplicación de 3 MB (OTA con rollback) y ~1.9 MB de LittleFS.

[platformio]
default_envs = esp32s3cam

[env]
framework = arduino
platform = espressif32@^6.9.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = particiones_ota.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    bertmelis/espMqttClient@^1.7.0
    bogde/HX711@^0.7.5
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

[env:esp32s3cam]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DPLACA_ESP32S3_CAM

[env:xiao_s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DPLACA_XIAO_S3_SENSE

; Solo la lógica sin hardware (src/logica). Unity viene con PlatformIO.
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<logica/>
build_unflags =
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
board_build.partitions =
board_build.filesystem =
